# ---------------------------------------------------------------------------
# Shopwise frontend — main nginx configuration
#
# The server block lives in templates/shopwise.conf.template instead of here.
# The nginx image renders every file in /etc/nginx/templates into
# /etc/nginx/conf.d at startup, substituting environment variables, which lets
# the listen port and the API upstream be set per environment without rebuilding
# the image. Only variables that actually exist in the environment are
# substituted, so nginx runtime variables such as $host are left untouched.
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" ${request_time}s';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    # Do not advertise the exact nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Rendered from templates/shopwise.conf.template at container start.
    include /etc/nginx/conf.d/*.conf;
}
