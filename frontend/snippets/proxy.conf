# ---------------------------------------------------------------------------
# Shared reverse-proxy directives for the backend.
#
# Included by every location that forwards to the API, so the header set is
# defined once instead of drifting across four copies.
#
# Note: `include` copies these directives verbatim, so a location that adds its
# own `add_header` still stops inheriting the server-level security headers.
# None of the proxied locations add headers, so that does not arise here.
# ---------------------------------------------------------------------------

proxy_pass http://shopwise_api;
proxy_http_version 1.1;

# $http_host, not $host: $host drops the port, which would make the backend see a
# different authority than the browser used and reject its Origin as cross-site.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Keep the upstream connection alive between requests.
proxy_set_header Connection "";

# An assistant turn can take a while, and buffering would make the reply appear
# all at once after a long pause.
proxy_buffering off;
proxy_read_timeout 180s;
proxy_send_timeout 180s;
