# ---------------------------------------------------------------------------
# Shopwise — host-networking variant
#
# Use this when Docker cannot create bridge networks, which happens inside
# nested containers whose kernel has no iptables/nftables support:
#
#   failed to create endpoint on network bridge: Unable to enable DIRECT ACCESS
#   FILTERING - DROP rule: iptables: can't initialize iptables table `raw'
#
#   docker compose -f docker-compose.yml -f docker-compose.host-network.yml up -d --build
#
# Every container shares the host network namespace, so Compose service names do
# not resolve and published-port mappings do not apply. Each service is
# therefore moved to its own port and wired together explicitly:
#
#   postgres  5433   (the host commonly already owns 5432)
#   backend   8081
#   frontend  8088   <- open this one
#
# Prefer docker-compose.yml alone wherever bridge networking works: it keeps the
# backend off the host network and lets services find each other by name.
# ---------------------------------------------------------------------------

services:
  postgres:
    network_mode: host
    networks: !reset []
    # A host-network container has no port mapping, so postgres is moved off the
    # default port to avoid colliding with a host installation.
    command: ["postgres", "-p", "5433"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U ${SHOPWISE_DB_USER:-shopwise} -d ${SHOPWISE_DB_NAME:-shopwise}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    # Builds need the host network too: a build step that installs packages needs
    # a working bridge, which is exactly what is unavailable here.
    build:
      network: host
    network_mode: host
    networks: !reset []
    environment:
      SERVER_PORT: "8081"
      SHOPWISE_DB_URL: jdbc:postgresql://127.0.0.1:5433/${SHOPWISE_DB_NAME:-shopwise}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      network: host
    network_mode: host
    networks: !reset []
    # Port mappings are meaningless under host networking.
    ports: !reset []
    environment:
      SHOPWISE_LISTEN_PORT: "8088"
      SHOPWISE_API_UPSTREAM: "127.0.0.1:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8088/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
